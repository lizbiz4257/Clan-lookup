<!DOCTYPE html>
<!-- v2026-09-05: adds Rosters tab (5k/4k/Bak3/3.5-4.0 groupings, mirrors the Google Sheets tabs, powered by the existing /api/lookup endpoint) + fixes _flags showing as a fake clan in Daily Scores. Previous: v2026-08-22c 6-week history + Daily Scores ghost-row filter + per-day Cards + sortable headers + Download Image button. If you don't see this comment when you view the raw file on GitHub, you have the wrong copy. -->
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Clan Lookup</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <style>
    :root {
      --accent: #2563eb;
      --accent-dark: #1d4ed8;
      --bg: #f7f8fa;
      --card: #ffffff;
      --border: #e3e6eb;
      --text: #1a1d23;
      --muted: #6b7280;
    }
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 24px 16px 60px;
    }
    .wrap { max-width: 720px; margin: 0 auto; }
    h1 { font-size: 20px; margin: 0 0 4px; }
    .sub { color: var(--muted); font-size: 13px; margin: 0 0 24px; }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 14px;
    }
    input {
      width: 100%; padding: 12px; border: 1px solid var(--border);
      border-radius: 8px; font-size: 15px; margin-bottom: 10px;
    }
    button {
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 12px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      width: 100%;
      margin-bottom: 8px;
    }
    button.secondary {
      background: #fff;
      color: var(--accent);
      border: 1px solid var(--accent);
    }
    button:active { opacity: 0.85; }
    button:disabled { background: #b9c2d0; color: #fff; cursor: not-allowed; border: none; }
    #status { font-size: 13px; margin-top: 8px; min-height: 16px; }
    #status.ok { color: #15803d; }
    #status.err { color: #b91c1c; }
    #status.busy { color: var(--muted); }
    table { width: 100%; border-collapse: collapse; font-size: 11.5px; }
    th { text-align: left; padding: 6px 4px; color: var(--muted); white-space: nowrap; }
    td { padding: 6px 4px; border-top: 1px solid var(--border); white-space: nowrap; }
    .spinner {
      display: inline-block; width: 12px; height: 12px;
      border: 2px solid #cbd5e1; border-top-color: var(--accent);
      border-radius: 50%; animation: spin 0.7s linear infinite;
      vertical-align: -2px; margin-right: 6px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .tabs { display: flex; gap: 8px; margin-bottom: 16px; }
    .tab {
      flex: 1; width: auto; margin: 0;
      background: #fff; color: var(--muted);
      border: 1px solid var(--border); border-radius: 8px;
      padding: 10px; font-size: 14px; font-weight: 600; cursor: pointer;
    }
    .tab.active { background: var(--accent); color: #fff; border-color: var(--accent); }
    select {
      width: 100%; padding: 12px; border: 1px solid var(--border);
      border-radius: 8px; font-size: 15px; margin-bottom: 10px; background: #fff;
    }
    .fieldlabel { font-size: 12px; color: var(--muted); font-weight: 600; margin: 0 0 4px; }
    td.num, th.num { text-align: right; }
    .threecol { font-weight: 700; color: var(--accent-dark); }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>Clan Lookup</h1>
    <p class="sub">Search one clan by tag, or pull everyone across all your family clans at once.</p>

    <div class="tabs">
      <button id="tabbtn-lookup" class="tab active" onclick="showTab('lookup')">Lookup</button>
      <button id="tabbtn-daily" class="tab" onclick="showTab('daily')">Daily Scores</button>
      <button id="tabbtn-rosters" class="tab" onclick="showTab('rosters')">Rosters</button>
    </div>

    <div id="tab-lookup">
    <div class="card">
      <input id="clanTagInput" type="text" placeholder="#XXXXXXX">
      <button onclick="lookupClan()">Look up this clan</button>
      <button class="secondary" onclick="lookupFamily()">Search all family clans</button>
      <div id="clanStatus" style="font-size:13px; margin-top:8px; min-height:16px;"></div>
    </div>

    <div class="card">
      <input id="playerInput" type="text" placeholder="Player name or #tag">
      <button onclick="lookupPlayer()">Look up player</button>
      <div id="playerStatus" style="font-size:13px; margin-top:8px; min-height:16px;"></div>
    </div>

    <button class="secondary" onclick="searchBoth()" style="max-width:720px; margin: -6px auto 4px; display:block;">Find this player, only within the clan above</button>
    <p style="text-align:center; color:var(--muted); font-size:12px; margin:0 0 14px;">Uses whatever's in the clan box to narrow the player search</p>

    <div id="clanResults"></div>
    <div id="newMembersResults"></div>
    <div id="playerResults"></div>
    </div><!-- /tab-lookup -->

    <div id="tab-daily" hidden>
      <div class="card">
        <p class="fieldlabel">Clan</p>
        <select id="dailyClan" onchange="onDailyClanChange()"></select>
        <p class="fieldlabel">Week</p>
        <select id="dailyWeek" onchange="renderDaily()"></select>
        <div id="dailyStatus" style="font-size:13px; margin-top:8px; min-height:16px;"></div>
      </div>
      <div id="dailyResults"></div>
    </div>

    <div id="tab-rosters" hidden>
      <div class="tabs">
        <button id="rgbtn-5k" class="tab active" onclick="showRosterGroup('5k')">5k Rosters</button>
        <button id="rgbtn-4k" class="tab" onclick="showRosterGroup('4k')">4k Rosters</button>
        <button id="rgbtn-bak3" class="tab" onclick="showRosterGroup('bak3')">Bak3</button>
        <button id="rgbtn-35-40" class="tab" onclick="showRosterGroup('35-40')">3.5/4.0</button>
      </div>
      <div id="rostersStatus" style="font-size:13px; margin: -8px 0 12px; min-height:16px;"></div>
      <div id="rostersResults"></div>
    </div>
  </div>

  <script>
    // Your 9 family clan tags
    const FAMILY_TAGS = [
      '#YQJPR2V9', '#L0PQ2ULQ', '#YRVC9QVJ', '#G9LRRP82',
      '#GURCRRY9', '#QJU8P80C', '#GY0QQGYY',
      '#QVY92JLV', '#GQ20UQR8'
    ];

    // !Baked! 2.5 (#G9LRRP82) and Dudes Reunited (#L0PQ2ULQ) are paused —
    // still fully searchable individually by tag, just excluded from the
    // bulk "Search all family clans" button.
    const ACTIVE_FAMILY_TAGS = FAMILY_TAGS.filter(
      (t) => t !== '#G9LRRP82' && t !== '#L0PQ2ULQ'
    );

    let lastClanData = null;
    let lastPlayerData = null;

    function playerLink(r) {
      const cleanTag = (r.tag || '').replace('#', '');
      return '<a href="https://royaleapi.com/player/' + cleanTag + '" target="_blank" style="color:var(--accent); text-decoration:none;">' + r.name + '</a>';
    }

    async function lookupClan() {
      const tag = document.getElementById('clanTagInput').value.trim();
      if (!tag) return;
      await runLookup([tag]);
    }

    async function lookupFamily() {
      await runLookup(ACTIVE_FAMILY_TAGS);
    }

    async function lookupPlayer() {
      const query = document.getElementById('playerInput').value.trim();
      if (!query) return;
      await runPlayerLookup(query);
    }

    async function searchBoth() {
      const clanTag = document.getElementById('clanTagInput').value.trim();
      const playerQuery = document.getElementById('playerInput').value.trim();
      if (!playerQuery) return;
      await runPlayerLookup(playerQuery, clanTag);
    }

    async function runPlayerLookup(query, clanScope) {
      const statusEl = document.getElementById('playerStatus');
      const resultsEl = document.getElementById('playerResults');
      const allButtons = document.querySelectorAll('button');
      allButtons.forEach(b => b.disabled = true);
      resultsEl.innerHTML = '';
      statusEl.className = 'busy';
      statusEl.innerHTML = '<span class="spinner"></span>Looking up…';

      try {
        let url = '/api/lookup?player=' + encodeURIComponent(query);
        if (clanScope) url += '&tags=' + encodeURIComponent(clanScope);
        const resp = await fetch(url);
        const data = await resp.json();
        allButtons.forEach(b => b.disabled = false);

        if (!resp.ok || data.error) {
          statusEl.className = 'err';
          statusEl.textContent = 'Error: ' + (data.error || 'Unknown error');
          return;
        }
        if (data.notFound) {
          statusEl.className = 'err';
          statusEl.textContent = 'No player found with that tag.';
          return;
        }
        if (data.noClanNameMatch) {
          statusEl.className = 'err';
          statusEl.textContent = 'No clan matched "' + clanScope + '".';
          return;
        }
        if (data.rows.length === 0) {
          statusEl.className = 'err';
          statusEl.textContent = 'No matches found for "' + query + '"' + (clanScope ? ' in "' + clanScope + '"' : ' in your family clans') + '.';
          return;
        }

        lastPlayerData = data;
        statusEl.className = 'ok';
        statusEl.textContent = data.rows.length + ' match' + (data.rows.length > 1 ? 'es' : '') + ' found' + (clanScope ? ' in ' + clanScope : '');
        renderTable(data, resultsEl, 'lastPlayerData');
      } catch (err) {
        allButtons.forEach(b => b.disabled = false);
        statusEl.className = 'err';
        statusEl.textContent = 'Error: ' + err.message;
      }
    }

    async function runLookup(tags) {
      const statusEl = document.getElementById('clanStatus');
      const resultsEl = document.getElementById('clanResults');
      const allButtons = document.querySelectorAll('button');
      allButtons.forEach(b => b.disabled = true);
      resultsEl.innerHTML = '';
      statusEl.className = 'busy';
      statusEl.innerHTML = '<span class="spinner"></span>Looking up…';

      try {
        const resp = await fetch('/api/lookup?tags=' + encodeURIComponent(tags.join(',')));
        const data = await resp.json();
        allButtons.forEach(b => b.disabled = false);

        if (!resp.ok || data.error) {
          statusEl.className = 'err';
          statusEl.textContent = 'Error: ' + (data.error || 'Unknown error');
          return;
        }

        lastClanData = data;
        let statusText = data.clans.map(c => c.clanName + ' (' + c.memberCount + ')').join(', ') +
          ' — ' + data.totalMembers + ' total members';
        if (data.failedClans && data.failedClans.length) {
          statusText += '. Failed: ' + data.failedClans.map(f => f.clanTag).join(', ');
        }
        statusEl.className = 'ok';
        statusEl.textContent = statusText;
        showCurrentOnly = true; // default to current members only on every fresh search
        renderClanTableWithToggle();
        renderNewMembersButton();
      } catch (err) {
        allButtons.forEach(b => b.disabled = false);
        statusEl.className = 'err';
        statusEl.textContent = 'Error: ' + err.message;
      }
    }

    let showCurrentOnly = true;

    function renderClanTableWithToggle() {
      const resultsEl = document.getElementById('clanResults');
      const allRows = lastClanData.rows || [];
      const currentCount = allRows.filter(r => r.inClan === 'Yes').length;
      const displayRows = showCurrentOnly ? allRows.filter(r => r.inClan === 'Yes') : allRows;
      const dataToRender = { ...lastClanData, rows: displayRows };

      resultsEl.innerHTML = '';
      if (currentCount < allRows.length) {
        const toggleLabel = showCurrentOnly
          ? 'Show all (' + allRows.length + ', including former members)'
          : 'Show current members only (' + currentCount + ')';
        resultsEl.innerHTML = '<button class="secondary" style="margin-bottom:10px;" onclick="toggleCurrentOnly()">' + toggleLabel + '</button>';
      }
      const tableContainer = document.createElement('div');
      resultsEl.appendChild(tableContainer);
      renderTable(dataToRender, tableContainer, 'lastClanData');
    }

    function toggleCurrentOnly() {
      showCurrentOnly = !showCurrentOnly;
      renderClanTableWithToggle();
    }

    function renderNewMembersButton() {
      const el = document.getElementById('newMembersResults');
      const newCount = (lastClanData.rows || []).filter(r => r.isNew).length;
      if (newCount === 0) {
        el.innerHTML = '';
        return;
      }
      el.innerHTML = '<button class="secondary" onclick="showNewMembersOnly()">Show new members only (' + newCount + ')</button>';
    }

    function showNewMembersOnly() {
      const el = document.getElementById('newMembersResults');
      const newRows = (lastClanData.rows || []).filter(r => r.isNew);

      let html = '<div class="card"><h2 style="font-size:14px; margin:0 0 4px;">New Members (' + newRows.length + ')</h2>';
      html += '<p style="color:var(--muted); font-size:12px; margin:0 0 10px;">6-week history shown automatically if they came from another family clan. Blank "Prior Clan" means they joined from outside the family — check that clan directly by tag if you know it.</p>';
      html += '<div style="overflow-x:auto;"><table>';
      html += '<tr><th>Name</th><th>Tag</th><th>Clan</th><th>Prior Clan</th>' +
        '<th>Wk1 Score</th><th>Wk1 Atk</th><th>Wk2 Score</th><th>Wk2 Atk</th>' +
        '<th>Wk3 Score</th><th>Wk3 Atk</th><th>Wk4 Score</th><th>Wk4 Atk</th>' +
        '<th>Wk5 Score</th><th>Wk5 Atk</th><th>Wk6 Score</th><th>Wk6 Atk</th>' +
        '<th>Prior Avg Score</th><th>Prior Avg Attacks</th><th>Weeks Tracked</th></tr>';
      newRows.forEach((r) => {
        const w = r.priorWeeks || [];
        html += '<tr>' +
          '<td>' + playerLink(r) + '</td>' +
          '<td>' + r.tag + '</td>' +
          '<td>' + (r.clanName || '–') + '</td>' +
          '<td>' + (r.priorClanName || '– (outside family)') + '</td>';
        for (let i = 0; i < 6; i++) {
          const wk = w[i];
          html += '<td>' + (wk ? wk.score : '–') + '</td>' + '<td>' + (wk ? wk.attacks : '–') + '</td>';
        }
        html += '<td>' + (r.priorAvgScore == null ? '–' : r.priorAvgScore) + '</td>' +
          '<td>' + (r.priorAvgAttacks == null ? '–' : r.priorAvgAttacks) + '</td>' +
          '<td>' + (r.priorWeeksTracked == null ? '–' : r.priorWeeksTracked) + '</td>' +
          '</tr>';
      });
      html += '</table></div></div>';
      el.innerHTML = html;
    }

    function renderTable(data, resultsEl, dataVarName) {
      let html = '<div class="card"><div style="overflow-x:auto;"><table>';
      const labels = (data.clans && data.clans[0] && data.clans[0].weekLabels) || [];
      const wkHeader = (i) => labels[i] || ('Wk' + (i + 1));
      html += '<tr><th>Name</th><th>Tag</th><th>Clan</th><th>In Clan</th><th>New?</th>' +
        '<th>Score This Week</th><th>Cards Played</th>' +
        '<th>' + wkHeader(0) + ' Score</th><th>' + wkHeader(0) + ' Atk</th>' +
        '<th>' + wkHeader(1) + ' Score</th><th>' + wkHeader(1) + ' Atk</th>' +
        '<th>' + wkHeader(2) + ' Score</th><th>' + wkHeader(2) + ' Atk</th>' +
        '<th>' + wkHeader(3) + ' Score</th><th>' + wkHeader(3) + ' Atk</th>' +
        '<th>' + wkHeader(4) + ' Score</th><th>' + wkHeader(4) + ' Atk</th>' +
        '<th>' + wkHeader(5) + ' Score</th><th>' + wkHeader(5) + ' Atk</th>' +
        '<th>Total 5k</th><th>Elo</th><th>5wa</th>' +
        '<th>5kP</th><th>5kG</th><th>5kPPG</th>' +
        '<th>Prior Clan</th><th>Prior Avg Score</th><th>Prior Avg Attacks</th>' +
        '</tr>';

      data.rows.forEach((r) => {
        const w = r.weeks || [];
        html += '<tr>' +
          '<td>' + playerLink(r) + '</td>' +
          '<td>' + r.tag + '</td>' +
          '<td>' + (r.clanName || '–') + '</td>' +
          '<td>' + r.inClan + '</td>' +
          '<td>' + (r.isNew ? 'Yes' : '–') + '</td>' +
          '<td>' + (r.thisWeekScore == null ? '–' : r.thisWeekScore) + '</td>' +
          '<td>' + (r.thisWeekAttacks == null ? '–' : r.thisWeekAttacks) + '</td>';
        for (let i = 0; i < 6; i++) {
          const wk = w[i];
          const priorMark = wk && wk.fromPriorClan ? ' *' : '';
          html += '<td>' + (wk ? wk.score + priorMark : '–') + '</td>' + '<td>' + (wk ? wk.attacks : '–') + '</td>';
        }
        html += '<td>' + (r.total5k == null ? '–' : r.total5k) + '</td>' +
          '<td>' + (r.elo == null ? '–' : r.elo) + '</td>' +
          '<td>' + (r.fivewa == null ? '–' : r.fivewa) + '</td>' +
          '<td>' + (r.fiveKP == null ? '–' : r.fiveKP) + '</td>' +
          '<td>' + (r.fiveKG == null ? '–' : r.fiveKG) + '</td>' +
          '<td>' + (r.fiveKPPG == null ? '–' : r.fiveKPPG) + '</td>' +
          '<td>' + (r.priorClanName || '–') + '</td>' +
          '<td>' + (r.priorAvgScore == null ? '–' : r.priorAvgScore) + '</td>' +
          '<td>' + (r.priorAvgAttacks == null ? '–' : r.priorAvgAttacks) + '</td>' +
          '</tr>';
      });
      html += '</table></div>';
      html += '<button style="margin-top:12px;" onclick="downloadExcel(' + dataVarName + ')">Download to Excel</button>';
      html += '<button class="secondary" style="margin-top:8px;" onclick="showSheetsFormula(' + dataVarName + ')">Get Google Sheets formula</button>';
      html += '<div id="sheetsFormula-' + dataVarName + '" style="margin-top:8px;"></div>';
      html += '</div>';
      resultsEl.innerHTML = html;
    }

    function showSheetsFormula(data) {
      const params = new URLSearchParams(window.location.search);
      let url = window.location.origin + '/api/export-csv?';
      if (data.clans && data.clans.length) {
        url += 'tags=' + encodeURIComponent(data.clans.map(c => c.clanTag).join(','));
      } else {
        url = window.location.origin + '/api/export-csv?player=' + encodeURIComponent(document.getElementById('playerInput').value.trim());
      }
      const formula = '=IMPORTDATA("' + url + '")';
      const varName = data === lastClanData ? 'lastClanData' : 'lastPlayerData';
      const el = document.getElementById('sheetsFormula-' + varName);
      el.innerHTML = '<div class="card" style="background:#f0f7ff;"><p style="font-size:12px; margin:0 0 8px;">Paste this into any cell in Google Sheets — it pulls live data automatically:</p>' +
        '<textarea readonly style="width:100%; height:60px; font-family:monospace; font-size:11px; padding:8px; border:1px solid var(--border); border-radius:6px;">' + formula + '</textarea></div>';
    }

    function downloadExcel(data) {
      if (!data) return;
      const multiClan = data.clans.length > 1;

      const headers = ['Name', 'Tag', 'Clan', 'In Clan', 'New?', 'Score This Week', 'Cards Played',
        'Week 1 Score', 'Week 1 Attacks', 'Week 2 Score', 'Week 2 Attacks',
        'Week 3 Score', 'Week 3 Attacks', 'Week 4 Score', 'Week 4 Attacks',
        'Week 5 Score', 'Week 5 Attacks', 'Week 6 Score', 'Week 6 Attacks',
        'Total 5k', 'Elo', '5wa', '5kP', '5kG', '5kPPG', 'Prior Clan', 'Prior Avg Score', 'Prior Avg Attacks'];

      const rows = data.rows.map((r) => {
        const w = r.weeks || [];
        const row = [r.name, r.tag, r.clanName || '', r.inClan, r.isNew ? 'Yes' : '', r.thisWeekScore, r.thisWeekAttacks];
        for (let i = 0; i < 6; i++) {
          const wk = w[i];
          row.push(wk ? wk.score : null, wk ? wk.attacks : null);
        }
        row.push(r.total5k, r.elo, r.fivewa, r.fiveKP, r.fiveKG, r.fiveKPPG, r.priorClanName || '', r.priorAvgScore, r.priorAvgAttacks);
        return row;
      });

      const ws = XLSX.utils.aoa_to_sheet([headers, ...rows]);
      const wb = XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(wb, ws, 'Clan Data');
      const filename = multiClan ? 'clan-family-lookup.xlsx' : (data.clans[0] ? data.clans[0].clanName.replace(/[^a-z0-9]/gi, '_') + '.xlsx' : 'player-lookup.xlsx');
      XLSX.writeFile(wb, filename);
    }

    // ---------------- DAILY SCORES TAB ----------------
    const CLAN_NAMES = {
      '#YQJPR2V9': 'Team Knockouts', '#YRVC9QVJ': '!Baked! 2.0', '#GURCRRY9': '!Baked! 1.0',
      '#LUCQVPRV': '!Baked! 1.5', '#QJU8P80C': '!Baked! 3.0', '#QVY92JLV': 'Baked 3.5',
      '#GQ20UQR8': 'Baked 4.0', '#GY0QQGYY': 'Just Peachy', '#L0PQ2ULQ': 'Dudes Reunited',
      '#G9LRRP82': '!Baked! 2.5', '#RYJ2V8V2': 'Team Lockouts', '#QLUUVQ': 'BBN',
      '#QC2LY9CY': '!Baked! Retired'
    };
    // Where to read the captured daily data from. Try the site's own copy first,
    // then fall back to the raw GitHub file (public repo).
    const DAILY_SOURCES = [
      '/data/day-corrections.json',
      'https://raw.githubusercontent.com/lizbiz4257/Clan-lookup/main/data/day-corrections.json'
    ];
    let dailyData = null;
    const dailyNameMaps = {}; // clanTag -> { PLAYERTAG: name } (best-effort, for weeks with no stored name)

    function showTab(name) {
      document.getElementById('tab-lookup').hidden = (name !== 'lookup');
      document.getElementById('tab-daily').hidden = (name !== 'daily');
      document.getElementById('tab-rosters').hidden = (name !== 'rosters');
      document.getElementById('tabbtn-lookup').classList.toggle('active', name === 'lookup');
      document.getElementById('tabbtn-daily').classList.toggle('active', name === 'daily');
      document.getElementById('tabbtn-rosters').classList.toggle('active', name === 'rosters');
      if (name === 'daily' && !dailyData) loadDailyData();
      if (name === 'rosters' && !currentRosterGroup) showRosterGroup('5k');
    }

    // ---------------- ROSTERS TAB ----------------
    // Consolidates the same 4 groupings used on the Google Sheets side (5k
    // Rosters, 4k Rosters, Bak3, 3.5/4.0) into one website view. Reuses the
    // SAME live /api/lookup endpoint (backed by lib/clanData.js's
    // lookupOneClan/buildFamilyIndex) that already powers the Lookup tab —
    // no Apps Script involved, since Apps Script only runs bound to a Google
    // Sheet and can't run on the website. This already IS the "auto-pull"
    // path: the site was already calling the Royale API live for the Lookup
    // tab, this just points that same call at fixed clan groups and renders
    // them together like the Sheets tabs do.
    const ROSTER_GROUPS = {
      '5k':    { label: '5k Rosters', tags: ['#YQJPR2V9', '#YRVC9QVJ'] }, // TKO + !Baked! 2.0
      '4k':    { label: '4k Rosters', tags: ['#GURCRRY9', '#LUCQVPRV'] }, // !Baked! 1.0 + !Baked! 1.5
      'bak3':  { label: 'Bak3',       tags: ['#QJU8P80C'] },              // !Baked! 3.0
      '35-40': { label: '3.5/4.0',    tags: ['#QVY92JLV', '#GQ20UQR8'] }  // Baked 3.5 + Baked 4.0
    };
    const rosterDataCache = {}; // group key -> last fetched data (avoids re-fetching on tab switch)
    let currentRosterGroup = null;

    function showRosterGroup(key) {
      currentRosterGroup = key;
      Object.keys(ROSTER_GROUPS).forEach((k) => {
        document.getElementById('rgbtn-' + k).classList.toggle('active', k === key);
      });
      if (rosterDataCache[key]) {
        renderRosterTable(key);
      } else {
        loadRosterGroup(key);
      }
    }

    async function loadRosterGroup(key) {
      const group = ROSTER_GROUPS[key];
      const status = document.getElementById('rostersStatus');
      const results = document.getElementById('rostersResults');
      status.className = 'busy';
      status.innerHTML = '<span class="spinner"></span>Loading ' + group.label + '…';
      results.innerHTML = '';
      try {
        const resp = await fetch('/api/lookup?tags=' + encodeURIComponent(group.tags.join(',')));
        const data = await resp.json();
        if (!resp.ok || data.error) throw new Error(data.error || 'Request failed');
        rosterDataCache[key] = data;
        status.className = '';
        status.textContent = '';
        if (currentRosterGroup === key) renderRosterTable(key);
      } catch (err) {
        status.className = 'err';
        status.textContent = 'Error loading ' + group.label + ': ' + err.message;
      }
    }

    function renderRosterTable(key) {
      const data = rosterDataCache[key];
      const results = document.getElementById('rostersResults');
      if (!data) return;
      const labels = (data.clans && data.clans[0] && data.clans[0].weekLabels) || [];
      const wkHeader = (i) => labels[i] || ('Wk' + (i + 1));
      let html = '<div class="card"><div style="overflow-x:auto;"><table>';
      html += '<tr><th>Name</th><th>Tag</th><th>Clan</th><th>In Clan</th>' +
        '<th>Score This Week</th><th>Cards Played</th>' +
        '<th>' + wkHeader(0) + ' Score</th><th>' + wkHeader(0) + ' Atk</th>' +
        '<th>' + wkHeader(1) + ' Score</th><th>' + wkHeader(1) + ' Atk</th>' +
        '<th>' + wkHeader(2) + ' Score</th><th>' + wkHeader(2) + ' Atk</th>' +
        '<th>' + wkHeader(3) + ' Score</th><th>' + wkHeader(3) + ' Atk</th>' +
        '<th>' + wkHeader(4) + ' Score</th><th>' + wkHeader(4) + ' Atk</th>' +
        '<th>' + wkHeader(5) + ' Score</th><th>' + wkHeader(5) + ' Atk</th>' +
        '<th>Total 5k</th><th>Elo</th><th>5wa</th>' +
        '<th>5kP</th><th>5kG</th><th>5kPPG</th></tr>';

      data.rows.forEach((r) => {
        const w = r.weeks || [];
        html += '<tr>' +
          '<td>' + playerLink(r) + '</td>' +
          '<td>' + r.tag + '</td>' +
          '<td>' + (r.clanName || '–') + '</td>' +
          '<td>' + r.inClan + '</td>' +
          '<td>' + (r.thisWeekScore == null ? '–' : r.thisWeekScore) + '</td>' +
          '<td>' + (r.thisWeekAttacks == null ? '–' : r.thisWeekAttacks) + '</td>';
        for (let i = 0; i < 6; i++) {
          const wk = w[i];
          const priorMark = wk && wk.fromPriorClan ? ' *' : '';
          html += '<td>' + (wk ? wk.score + priorMark : '–') + '</td>' + '<td>' + (wk ? wk.attacks : '–') + '</td>';
        }
        html += '<td>' + (r.total5k == null ? '–' : r.total5k) + '</td>' +
          '<td>' + (r.elo == null ? '–' : r.elo) + '</td>' +
          '<td>' + (r.fivewa == null ? '–' : r.fivewa) + '</td>' +
          '<td>' + (r.fiveKP == null ? '–' : r.fiveKP) + '</td>' +
          '<td>' + (r.fiveKG == null ? '–' : r.fiveKG) + '</td>' +
          '<td>' + (r.fiveKPPG == null ? '–' : r.fiveKPPG) + '</td>' +
          '</tr>';
      });
      html += '</table></div>';
      html += '<button style="margin-top:12px;" onclick="downloadRosterExcel(\'' + key + '\')">Download to Excel</button>';
      html += '<button class="secondary" style="margin-top:8px;" onclick="loadRosterGroup(\'' + key + '\')">Refresh</button>';
      html += '</div>';
      results.innerHTML = html;
    }

    function downloadRosterExcel(key) {
      const data = rosterDataCache[key];
      if (!data) return;
      const group = ROSTER_GROUPS[key];
      const headers = ['Name', 'Tag', 'Clan', 'In Clan', 'Score This Week', 'Cards Played',
        'Week 1 Score', 'Week 1 Attacks', 'Week 2 Score', 'Week 2 Attacks',
        'Week 3 Score', 'Week 3 Attacks', 'Week 4 Score', 'Week 4 Attacks',
        'Week 5 Score', 'Week 5 Attacks', 'Week 6 Score', 'Week 6 Attacks',
        'Total 5k', 'Elo', '5wa', '5kP', '5kG', '5kPPG'];
      const rows = data.rows.map((r) => {
        const w = r.weeks || [];
        const row = [r.name, r.tag, r.clanName || '', r.inClan, r.thisWeekScore, r.thisWeekAttacks];
        for (let i = 0; i < 6; i++) {
          const wk = w[i];
          row.push(wk ? wk.score : null, wk ? wk.attacks : null);
        }
        row.push(r.total5k, r.elo, r.fivewa, r.fiveKP, r.fiveKG, r.fiveKPPG);
        return row;
      });
      const ws = XLSX.utils.aoa_to_sheet([headers, ...rows]);
      const wb = XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(wb, ws, group.label);
      XLSX.writeFile(wb, group.label.replace(/[^a-z0-9]/gi, '_') + '.xlsx');
    }

    async function loadDailyData() {
      const status = document.getElementById('dailyStatus');
      status.className = 'busy';
      status.innerHTML = '<span class="spinner"></span>Loading daily data…';
      let json = null, lastErr = 'no source';
      for (const src of DAILY_SOURCES) {
        try {
          const r = await fetch(src, { cache: 'no-store' });
          if (r.ok) { json = await r.json(); break; }
          lastErr = 'HTTP ' + r.status;
        } catch (e) { lastErr = e.message; }
      }
      if (!json) { status.className = 'err'; status.textContent = 'Could not load daily data (' + lastErr + ').'; return; }
      dailyData = json;
      // FIX (2026-09-05): only '_meta' was excluded here, so '_flags' (a non-
      // empty array the daily-snapshot script uses to log suspicious/impossible
      // day values) slipped through as if it were a real clan tag — showing up
      // in the Clan dropdown as "_flags", and picking it made the Week dropdown
      // show array indices (e.g. "72") since Object.keys() on an array just
      // returns its index numbers. Excluding every underscore-prefixed key
      // (not just '_meta') future-proofs this against any other metadata keys
      // the snapshot script adds later.
      const tags = Object.keys(json).filter((t) => t.charAt(0) !== '_' && json[t] && Object.keys(json[t]).length);
      const clanSel = document.getElementById('dailyClan');
      clanSel.innerHTML = tags.map((t) => '<option value="' + t + '">' + (CLAN_NAMES[t] || t) + '</option>').join('');
      if (!tags.length) {
        status.className = 'err';
        status.textContent = 'No daily data captured yet — check back after the tracker has run on a war day.';
        document.getElementById('dailyWeek').innerHTML = '';
        document.getElementById('dailyResults').innerHTML = '';
        return;
      }
      status.className = ''; status.textContent = '';
      onDailyClanChange();
    }

    // Newest week first. Sort "134-1"/"133-5" by season then section descending;
    // anything unparseable falls to the end.
    function dailyWeekCompare(a, b) {
      const pa = /^(\d+)-(\d+)$/.exec(a), pb = /^(\d+)-(\d+)$/.exec(b);
      if (pa && pb) { const s = (+pb[1]) - (+pa[1]); return s !== 0 ? s : (+pb[2]) - (+pa[2]); }
      if (pa) return -1;
      if (pb) return 1;
      return a < b ? 1 : -1;
    }

    async function onDailyClanChange() {
      const tag = document.getElementById('dailyClan').value;
      const weeks = Object.keys(dailyData[tag] || {}).sort(dailyWeekCompare);
      document.getElementById('dailyWeek').innerHTML = weeks.map((w) => '<option value="' + w + '">' + w + '</option>').join('');
      // Best-effort names for players whose row has no stored name (older weeks).
      if (!dailyNameMaps[tag]) {
        try {
          const r = await fetch('/api/lookup?tags=' + encodeURIComponent(tag));
          if (r.ok) {
            const d = await r.json();
            const m = {};
            (d.rows || []).forEach((row) => { if (row.tag) m[row.tag.toUpperCase()] = row.name; });
            dailyNameMaps[tag] = m;
          }
        } catch (e) { /* names are optional */ }
      }
      renderDaily();
    }

    // Column definitions for the Daily Scores table: key = field on each row
    // object, label = header text, type = 'num' (default) or 'text' (name col
    // sorts alphabetically instead of numerically).
    const DAILY_COLUMNS = [
      { key: 'name',    label: 'Name',        type: 'text' },
      { key: 'd1',      label: 'D1 Score' },
      { key: 'a1',      label: 'Cards' },
      { key: 'd2',      label: 'D2 Score' },
      { key: 'a2',      label: 'Cards' },
      { key: 'd3',      label: 'D3 Score' },
      { key: 'a3',      label: 'Cards' },
      { key: 'd4',      label: 'D4 Score' },
      { key: 'a4',      label: 'Cards' },
      { key: 'three',   label: '3-Day' },
      { key: 'total',   label: 'Total' },
      { key: 'attacks', label: 'Total Cards' }
    ];
    let dailySortKey = 'total';
    let dailySortDir = -1; // -1 = high-to-low / Z-to-A, 1 = low-to-high / A-to-Z
    let dailyRowsCache = []; // last-rendered rows, reused by sortDaily() and downloadDailyImage()

    // Clicking a header sorts by that column; clicking the SAME header again
    // flips the direction, so every column works both high-to-low and back.
    function sortDaily(key) {
      if (dailySortKey === key) {
        dailySortDir = -dailySortDir;
      } else {
        dailySortKey = key;
        dailySortDir = (key === 'name') ? 1 : -1; // names default A-to-Z, numbers default high-to-low
      }
      renderDaily();
    }

    function renderDaily() {
      const tag = document.getElementById('dailyClan').value;
      const week = document.getElementById('dailyWeek').value;
      const el = document.getElementById('dailyResults');
      if (!tag || !week || !dailyData[tag] || !dailyData[tag][week]) { el.innerHTML = ''; return; }
      const players = dailyData[tag][week].players || {};
      const nameMap = dailyNameMaps[tag] || {};
      const fameOf = (p, k) => (p[k] && typeof p[k].fame === 'number') ? p[k].fame : 0;
      const atkOf = (p, k) => (p[k] && typeof p[k].attacks === 'number') ? p[k].attacks : 0;

      const rows = Object.keys(players).map((ptag) => {
        const p = players[ptag];
        const d1 = fameOf(p, 'd1'), d2 = fameOf(p, 'd2'), d3 = fameOf(p, 'd3'), d4 = fameOf(p, 'd4');
        const a1 = atkOf(p, 'd1'), a2 = atkOf(p, 'd2'), a3 = atkOf(p, 'd3'), a4 = atkOf(p, 'd4');
        const three = d1 + d2 + d3, total = three + d4;
        const attacks = a1 + a2 + a3 + a4;
        const name = p.name || nameMap[ptag.toUpperCase()] || ptag;
        return { ptag, name, d1, d2, d3, d4, a1, a2, a3, a4, three, total, attacks };
      })
        // Skip players with zero fame AND zero attacks across all four days —
        // these are stale leftovers (most commonly from a messy transition
        // week where the capture ran multiple times against shifting rosters),
        // not anyone who actually took part in this week's war. A genuine
        // current member who simply didn't attack still wouldn't show real
        // activity anywhere, so this is indistinguishable from clutter and
        // safe to hide either way.
        .filter((r) => r.total > 0 || r.attacks > 0);

      rows.sort((x, y) => {
        const colDef = DAILY_COLUMNS.find((c) => c.key === dailySortKey);
        if (colDef && colDef.type === 'text') {
          return dailySortDir * String(x[dailySortKey]).localeCompare(String(y[dailySortKey]));
        }
        return dailySortDir * ((x[dailySortKey] || 0) - (y[dailySortKey] || 0));
      });
      dailyRowsCache = rows;

      let html = '<div class="card"><div id="dailyTableWrap" style="overflow-x:auto;"><table>';
      html += '<tr>' + DAILY_COLUMNS.map((c) => {
        const active = c.key === dailySortKey;
        const arrow = active ? (dailySortDir === 1 ? ' ▲' : ' ▼') : '';
        const cls = c.type === 'text' ? '' : 'num';
        return '<th class="' + cls + '" style="cursor:pointer; user-select:none;' + (active ? ' color:var(--accent);' : '') +
          '" onclick="sortDaily(\'' + c.key + '\')" title="Click to sort">' + c.label + arrow + '</th>';
      }).join('') + '</tr>';
      rows.forEach((r) => {
        const cleanTag = (r.ptag || '').replace('#', '');
        const nameCell = (r.name === r.ptag)
          ? r.ptag
          : '<a href="https://royaleapi.com/player/' + cleanTag + '" target="_blank" style="color:var(--accent); text-decoration:none;">' + r.name + '</a>';
        html += '<tr>' +
          '<td>' + nameCell + '</td>' +
          '<td class="num">' + r.d1 + '</td><td class="num">' + r.a1 + '</td>' +
          '<td class="num">' + r.d2 + '</td><td class="num">' + r.a2 + '</td>' +
          '<td class="num">' + r.d3 + '</td><td class="num">' + r.a3 + '</td>' +
          '<td class="num">' + r.d4 + '</td><td class="num">' + r.a4 + '</td>' +
          '<td class="num threecol">' + r.three + '</td>' +
          '<td class="num">' + r.total + '</td>' +
          '<td class="num">' + r.attacks + '</td>' +
          '</tr>';
      });
      html += '</table></div>';
      html += '<p style="color:var(--muted); font-size:12px; margin:10px 0;">' + rows.length + ' players · Cards = attacks used that day (max 4) · 3-Day = D1+D2+D3 score (Day 4 excluded) · Total = all four days · click any column header to sort.</p>';
      html += '<button onclick="downloadDailyImage()">Download image (for Discord, etc.)</button>';
      html += '<span id="dailyImageStatus" style="color:var(--muted); font-size:12px; margin-left:10px;"></span>';
      html += '</div>';
      el.innerHTML = html;
    }

    // Renders the CURRENT (already filtered + sorted) Daily Scores table as a
    // PNG and downloads it — no server round trip, just a snapshot of what's
    // on screen right now, so whatever sort order you left it in is what gets
    // shared. From there it's a normal image file: drag it into Discord, or
    // use your phone/OS share sheet, same as any other photo.
    async function downloadDailyImage() {
      const status = document.getElementById('dailyImageStatus');
      const wrap = document.getElementById('dailyTableWrap');
      if (!wrap || typeof html2canvas === 'undefined') {
        if (status) status.textContent = 'Image tool failed to load — try refreshing the page.';
        return;
      }
      status.textContent = 'Rendering…';
      try {
        const canvas = await html2canvas(wrap, { backgroundColor: '#ffffff', scale: 2 });
        const tag = document.getElementById('dailyClan').value;
        const week = document.getElementById('dailyWeek').value;
        const clanName = (CLAN_NAMES[tag] || tag).replace(/[^a-z0-9]/gi, '_');
        const link = document.createElement('a');
        link.download = clanName + '_week' + week + '_daily_scores.png';
        link.href = canvas.toDataURL('image/png');
        link.click();
        status.textContent = 'Downloaded.';
      } catch (err) {
        status.textContent = 'Could not render image: ' + err.message;
      }
    }

    document.getElementById('clanTagInput').addEventListener('keydown', function (e) {
      if (e.key === 'Enter') lookupClan();
    });
    document.getElementById('playerInput').addEventListener('keydown', function (e) {
      if (e.key === 'Enter') lookupPlayer();
    });
  </script>
</body>
</html>
